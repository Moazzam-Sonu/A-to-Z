<ul class="breadcrumbs">
    {{#unless theme_settings.hide_breadcrumbs}}
        {{#each breadcrumbs}}
            <li class="breadcrumb {{#if @last}}is-active{{/if}}">
                {{#or @last (if url "==" null)}}
                    <span class="breadcrumb-label">{{name}}</span>
                {{else}}
                    <a href="{{url}}" class="breadcrumb-label" style="display:flex; align-items:center; gap:10px;">
                        <span><b>{{name}}</b></span>
                        <svg style="margin-right:10px;" xmlns="http://www.w3.org/2000/svg" width="13" height="19" viewBox="0 0 13 19" fill="none">
<rect x="0.451172" y="16.9772" width="19" height="3" transform="rotate(-60 0.451172 16.9772)" fill="url(#paint0_linear_186_622)" fill-opacity="0.8"/>
<defs>
<linearGradient id="paint0_linear_186_622" x1="3.20617" y1="17.6772" x2="11.1474" y2="24.98" gradientUnits="userSpaceOnUse">
<stop stop-color="#6C36E0"/>
<stop offset="1" stop-color="#D73CE7"/>
</linearGradient>
</defs>
</svg>
                    </a>
                {{/or}}
            </li>
        {{/each}}
    {{/unless}}
</ul>

<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement":
    [
        {{#each breadcrumbs}}
        {
            "@type": "ListItem",
            "position": {{add @index 1}},
            "item": {
                "@id": {{{JSONstringify url}}},
                "name": {{{JSONstringify name}}}
            }
        }{{#unless @last}},{{/unless}}
        {{/each}}
    ]
}
</script>
<style>

    .breadcrumb.is-active .breadcrumb-label {
        color: #444444;

    }
</style>
